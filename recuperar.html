<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Restablecer contraseña · Tejiendo Sueños Clau</title>

<style>

*{
    box-sizing:border-box;
}

html,
body,
button,
input{
    font-family:
        "Century Gothic",
        CenturyGothic,
        AppleGothic,
        sans-serif;
}

body{

    margin:0;

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#faf5f7;

}

.card{

    width:min(420px,92%);

    background:white;

    padding:35px 28px;

    border-radius:16px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.10);

    text-align:center;

}

.login-logo{width:150px;max-width:80%;margin-bottom:15px}
.login-card h1{margin:5px 0;color:var(--pd);font-size:28px}
.login-subtitle{color:var(--mut);margin-bottom:25px}
.login-card label{text-align:left}

h1{

    margin:8px 0;

    color:#555;

}

p{

    color:#777;

    font-size:14px;

}

label{

    display:block;

    text-align:left;

    margin-top:20px;

    margin-bottom:6px;

    color:#666;

}

input{

    width:100%;

    padding:12px;

    border:1px solid #ddd;

    border-radius:8px;

    font-size:15px;

}

button{

    width:100%;

    margin-top:20px;

    padding:12px;

    border:0;

    border-radius:8px;

    background:#d85b78;

    color:white;

    font-size:15px;

    cursor:pointer;

}

button:hover{

    filter:brightness(.96);

}

.mensaje{

    margin-top:15px;

    min-height:20px;

    font-size:14px;

}

.volver{

    display:block;

    margin-top:18px;

    color:#d85b78;

    text-decoration:none;

    font-size:14px;

}

.grilla-icon{
    width:22px;
    height:22px;
    object-fit:contain;
    vertical-align:middle;
}

</style>

</head>

<body>

<div class="card">

    <img
        src="img/logo.png"
        alt="Tejiendo Sueños Clau"
        class="logo"
    >

    <h1>
        <img src="img/key.png" alt="PDF" class="grilla-icon"> Nueva contraseña
    </h1>

    <form id="resetForm">

        <label for="password">
            Nueva contraseña
        </label>

        <input
            id="password"
            type="password"
            minlength="6"
            required
            placeholder="Nueva contraseña"
        >

        <label for="password2">
            Confirmar contraseña
        </label>

        <input
            id="password2"
            type="password"
            minlength="6"
            required
            placeholder="Repite la contraseña"
        >

        <button type="submit">
            🔐 Cambiar contraseña
        </button>

    </form>

    <div
        id="mensaje"
        class="mensaje"
    ></div>

    <a
        href="facturacion.html"
        class="volver"
    >
        ← Volver al inicio de sesión
    </a>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase-config.js"></script>

<script>

const db =
    window.supabaseClient;


const form =
    document.getElementById("resetForm");

const mensaje =
    document.getElementById("mensaje");


form.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        const password =
            document.getElementById("password").value;

        const password2 =
            document.getElementById("password2").value;


        if(password !== password2){

            mensaje.style.color =
                "#c62828";

            mensaje.textContent =
                "❌ Las contraseñas no coinciden.";

            return;
        }


        if(password.length < 6){

            mensaje.style.color =
                "#c62828";

            mensaje.textContent =
                "❌ La contraseña debe tener al menos 6 caracteres.";

            return;
        }


        try{

            const { error } =
                await db.auth.updateUser({
                    password: password
                });


            if(error) throw error;


            mensaje.style.color =
                "#198b4b";

            mensaje.textContent =
                "✅ Contraseña actualizada correctamente.";

            form.reset();


            setTimeout(() => {

                window.location.href =
                    "facturacion.html";

            },2000);


        }catch(error){

            console.error(error);

            mensaje.style.color =
                "#c62828";

            mensaje.textContent =
                "❌ El enlace no es válido o ya expiró.";

        }

    }

);

</script>

</body>

</html>
